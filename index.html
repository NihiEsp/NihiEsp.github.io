<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAISON — Navigation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES
    ============================================================ */
    :root {
      --bg: #f8f7f4;
      --fg: #1a1917;
      --fg-muted: rgba(26, 25, 23, 0.45);
      --fg-subtle: rgba(26, 25, 23, 0.22);
      --pill-bg: rgba(0, 0, 0, 0.04);
      --nav-height: 72px;
      --easing-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --easing-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --easing-out: cubic-bezier(0.0, 0, 0.2, 1);
    }

    /* ============================================================
       DARK MODE OVERRIDES
    ============================================================ */
    [data-theme="dark"] {
      --bg: #111010;
      --fg: #ede9e3;
      --fg-muted: rgba(237, 233, 227, 0.42);
      --fg-subtle: rgba(237, 233, 227, 0.15);
      --pill-bg: rgba(255, 255, 255, 0.06);
    }

    /* Smooth crossfade between themes */
    body, .nav, .page, .music-sidebar {
      transition: background-color 0.4s ease, color 0.4s ease,
                  border-color 0.4s ease;
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      width: 100%;
      height: 100vh;
    }

    /* ============================================================
       PAGE LAYOUT
    ============================================================ */
    .page {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* ============================================================
       NAV BASE
    ============================================================ */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: var(--bg);
      z-index: 100;
      overflow: visible;
      contain: layout style;
    }

    /* Hairline bottom border — draws in on entrance */
    .nav-border {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 1px;
      background: var(--fg-subtle);
      width: 0%;
      transform-origin: left center;
      will-change: width;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: 0 40px;
      opacity: 0;
    }

    /* ============================================================
       BRAND / LOGO
    ============================================================ */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      position: relative;
      flex-shrink: 0;
    }

    .brand-logo {
      height: 28px;
      width: auto;
      max-width: 120px;
      display: block;
      transition: opacity 0.4s cubic-bezier(0.23, 1, 0.32, 1),
                  transform 0.4s var(--easing-spring);
      will-change: transform;
    }

    .brand-logo--hidden {
      display: none !important;
    }

    .brand:hover .brand-logo {
      opacity: 0.75;
      transform: scale(0.97);
    }

    .brand-mark {
      font-size: 14px;
      flex-shrink: 0;
      color: var(--fg);
      opacity: 0.7;
      display: flex;
      align-items: center;
      will-change: transform;
    }

    /* ============================================================
       NAV LINKS — CENTER
    ============================================================ */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
      transition: opacity 0.35s var(--easing-smooth),
                  transform 0.35s var(--easing-smooth);
    }

    /* Morphing pill */
    .nav-pill {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      height: 32px;
      border-radius: 100px;
      background: var(--pill-bg);
      pointer-events: none;
      opacity: 0;
      will-change: transform, width, opacity;
    }

    .nav-link {
      position: relative;
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--fg-muted);
      cursor: pointer;
      user-select: none;
      padding: 7px 14px;
      border-radius: 100px;
      transition: color 0.25s var(--easing-smooth);
      white-space: nowrap;
      display: flex;
      align-items: center;
      will-change: transform;
    }

    .nav-link:hover {
      color: var(--fg);
    }

    /* Each letter inside nav-link */
    .nav-link .char {
      display: inline-block;
      transition: transform 0.35s var(--easing-spring),
                  opacity 0.35s var(--easing-smooth);
      will-change: transform;
    }

    /* ============================================================
       SEARCH ICON (RIGHT)
    ============================================================ */
    .nav-right {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      position: relative;
      min-width: 80px;
      justify-content: flex-end;
    }

    .search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      border-radius: 50%;
      transition: background 0.2s var(--easing-smooth),
                  opacity 0.25s var(--easing-smooth),
                  transform 0.25s var(--easing-smooth);
    }

    .search-btn:hover {
      background: var(--pill-bg);
    }

    .search-btn--hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    .search-icon {
      position: relative;
      width: 18px;
      height: 18px;
    }

    .search-icon svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .search-circle {
      fill: none;
      stroke: var(--fg-muted);
      stroke-width: 1.3;
      transition: r 0.28s var(--easing-spring),
                  stroke 0.2s var(--easing-smooth),
                  transform 0.28s var(--easing-spring);
      transform-origin: 7.5px 7.5px;
      transform-box: fill-box;
    }

    .search-line {
      stroke: var(--fg-muted);
      stroke-width: 1.3;
      stroke-linecap: round;
      transition: x2 0.28s var(--easing-spring),
                  y2 0.28s var(--easing-spring),
                  stroke 0.2s var(--easing-smooth);
    }

    .search-btn:hover .search-circle {
      stroke: var(--fg);
      transform: scale(1.18);
    }

    .search-btn:hover .search-line {
      stroke: var(--fg);
    }

    /* ============================================================
       SEARCH EXPANDED STATE
    ============================================================ */
    .search-expanded {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      width: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: width 0.45s cubic-bezier(0.23, 1, 0.32, 1),
                  opacity 0.3s var(--easing-smooth);
    }

    .search-expanded.active {
      width: 260px;
      opacity: 1;
      pointer-events: auto;
    }

    .search-input {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      border-bottom: 1px solid var(--fg-subtle);
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--fg);
      padding: 4px 0 5px;
      caret-color: var(--fg);
    }

    .search-input::placeholder {
      color: var(--fg-muted);
    }

    .search-close {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.2s;
    }

    .search-close:hover {
      opacity: 1;
    }

    .search-close svg {
      width: 10px;
      height: 10px;
    }

    /* ============================================================
       LINKS FADE DURING SEARCH
    ============================================================ */
    .nav-links.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-10px);
    }

    /* ============================================================
       CURSOR TRAIL CANVAS
    ============================================================ */
    #trail-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      pointer-events: none;
      z-index: 99;
    }

    /* ============================================================
       MOBILE RESPONSIVE
    ============================================================ */
    @media (max-width: 700px) {
      .nav-inner {
        padding: 0 20px;
      }

      .nav-link {
        padding: 7px 10px;
        font-size: 11.5px;
      }

      .nav-links {
        gap: 0;
      }
    }

    @media (max-width: 520px) {
      .nav-inner {
        padding: 0 16px;
      }

      .nav-link[data-label="Portfolio"],
      .nav-link[data-label="Pricing"] {
        display: none;
      }
    }

    /* ============================================================
       THEME TOGGLE
    ============================================================ */
    .theme-toggle {
      position: fixed;
      bottom: 28px;
      left: 28px;
      z-index: 200;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--fg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--fg-muted);
      transition: color 0.25s var(--easing-smooth),
                  background 0.2s var(--easing-smooth),
                  border-color 0.4s ease,
                  transform 0.5s var(--easing-spring);
    }

    .theme-toggle:hover {
      background: var(--pill-bg);
      color: var(--fg);
      transform: rotate(30deg);
    }

    .theme-toggle svg {
      width: 14px;
      height: 14px;
      transition: opacity 0.2s ease;
    }

    /* ============================================================
       MUSIC SIDEBAR
    ============================================================ */
    .music-tab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 72px;
      background: var(--bg);
      border: 1px solid var(--fg-subtle);
      border-right: none;
      border-radius: 6px 0 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 95;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                  right 0.5s cubic-bezier(0.23, 1, 0.32, 1),
                  background 0.2s ease,
                  border-color 0.4s ease;
    }

    .music-tab:hover {
      background: var(--pill-bg);
    }

    .music-tab.sidebar-open {
      right: 280px;
    }

    .music-tab svg {
      width: 14px;
      height: 14px;
      color: var(--fg-muted);
      transition: color 0.2s ease, transform 0.3s var(--easing-spring);
    }

    .music-tab:hover svg {
      color: var(--fg);
    }

    .music-tab.sidebar-open svg {
      transform: scaleX(-1);
    }

    .music-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 280px;
      background: var(--bg);
      border-left: 1px solid var(--fg-subtle);
      z-index: 90;
      transform: translateX(100%);
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .music-sidebar.open {
      transform: translateX(0);
    }

    .music-sidebar-inner {
      padding: calc(var(--nav-height) + 32px) 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .music-sidebar-inner::-webkit-scrollbar { display: none; }

    /* Album art */
    .music-art {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .music-art svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Track info */
    .music-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .music-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--fg);
      letter-spacing: 0.01em;
    }

    .music-artist {
      font-size: 11px;
      font-weight: 300;
      color: var(--fg-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* Progress */
    .music-progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .music-progress {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: var(--fg-subtle);
      border-radius: 1px;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .music-progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--fg);
      cursor: pointer;
      transition: transform 0.2s var(--easing-spring);
    }

    .music-progress:hover::-webkit-slider-thumb {
      transform: scale(1.4);
    }

    .music-progress::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--fg);
      border: none;
      cursor: pointer;
    }

    .music-time {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--fg-muted);
      letter-spacing: 0.04em;
      font-weight: 300;
    }

    /* Controls */
    .music-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .music-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--fg-muted);
      transition: color 0.2s ease, transform 0.25s var(--easing-spring);
      border-radius: 50%;
    }

    .music-btn:hover {
      color: var(--fg);
    }

    .music-btn.play {
      width: 40px;
      height: 40px;
      background: var(--fg);
      color: var(--bg);
      border-radius: 50%;
      transition: background 0.2s ease, color 0.2s ease,
                  transform 0.3s var(--easing-spring);
    }

    .music-btn.play:hover {
      transform: scale(1.08);
      color: var(--bg);
    }

    .music-btn.play svg { width: 16px; height: 16px; }
    .music-btn:not(.play) svg { width: 15px; height: 15px; }

    /* Volume */
    .music-volume-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .music-volume-icon {
      color: var(--fg-muted);
      flex-shrink: 0;
    }

    .music-volume-icon svg { width: 13px; height: 13px; }

    .music-volume {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 2px;
      background: var(--fg-subtle);
      border-radius: 1px;
      outline: none;
      cursor: pointer;
    }

    .music-volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg-muted);
      cursor: pointer;
      transition: transform 0.2s var(--easing-spring), background 0.2s;
    }

    .music-volume:hover::-webkit-slider-thumb {
      transform: scale(1.5);
      background: var(--fg);
    }

    .music-volume::-moz-range-thumb {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fg-muted);
      border: none;
      cursor: pointer;
    }

    /* Playlist */
    .music-playlist-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg-subtle);
      margin-bottom: -14px;
    }

    .music-playlist {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .music-track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .music-track-item:hover {
      background: var(--pill-bg);
    }

    .music-track-item.active {
      background: var(--pill-bg);
    }

    .music-track-item.active .music-track-name {
      color: var(--fg);
    }

    .music-track-num {
      font-size: 10px;
      color: var(--fg-subtle);
      width: 14px;
      flex-shrink: 0;
      text-align: center;
    }

    .music-track-item.active .music-track-num {
      color: var(--fg-muted);
    }

    .music-track-info { flex: 1; }

    .music-track-name {
      font-size: 12px;
      color: var(--fg-muted);
      letter-spacing: 0.01em;
    }

    .music-track-dur {
      font-size: 10px;
      color: var(--fg-subtle);
      flex-shrink: 0;
      font-weight: 300;
    }
  </style>
</head>
<body>

<!-- Cursor trail canvas (only inside nav area) -->
<canvas id="trail-canvas" aria-hidden="true"></canvas>

<!-- Theme toggle — bottom-left corner -->
<div class="theme-toggle" id="theme-toggle" tabindex="0" role="button" aria-label="Toggle dark mode">
  <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="display:none">
    <circle cx="12" cy="12" r="4"/>
    <line x1="12" y1="2" x2="12" y2="5"/>
    <line x1="12" y1="19" x2="12" y2="22"/>
    <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
    <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
    <line x1="2" y1="12" x2="5" y2="12"/>
    <line x1="19" y1="12" x2="22" y2="12"/>
    <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
    <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
  </svg>
  <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>
  </svg>
</div>

<div class="page">
  <nav class="nav" id="main-nav" aria-label="Primary navigation">
    <div class="nav-border" id="nav-border"></div>

    <div class="nav-inner" id="nav-inner">

      <!-- LEFT: Brand -->
      <div class="brand" id="brand" tabindex="0" role="button" aria-label="MAISON home">
        <span class="brand-mark" id="brand-mark" aria-hidden="true">✦</span>
        <img
          class="brand-logo"
          id="brand-logo"
          src="pictures/logo.png"
          alt="Logo"
          onerror="this.classList.add('brand-logo--hidden')"
        />
      </div>

      <!-- CENTER: Nav Links -->
      <div class="nav-links" id="nav-links" role="navigation">
        <div class="nav-pill" id="nav-pill" aria-hidden="true"></div>
        <!-- Links injected by JS -->
      </div>

      <!-- RIGHT: Search -->
      <div class="nav-right" id="nav-right">
        <div class="search-btn" id="search-btn" tabindex="0" role="button" aria-label="Search" aria-expanded="false">
          <div class="search-icon">
            <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <circle class="search-circle" id="search-circle" cx="7.5" cy="7.5" r="5"/>
              <line class="search-line" id="search-line"
                x1="11.5" y1="11.5"
                x2="15.5" y2="15.5"/>
            </svg>
          </div>
        </div>

        <div class="search-expanded" id="search-expanded" aria-hidden="true">
          <input
            class="search-input"
            id="search-input"
            type="text"
            placeholder="Type to search..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Search"
          />
          <div class="search-close" id="search-close" role="button" tabindex="0" aria-label="Close search">
            <svg viewBox="0 0 10 10" fill="none">
              <line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
              <line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>

    </div>
  </nav>
</div>

<!-- Music sidebar tab -->
<div class="music-tab" id="music-tab" tabindex="0" role="button" aria-label="Toggle music player" aria-expanded="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l12-2v13"/>
    <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
  </svg>
</div>

<!-- Music player sidebar -->
<aside class="music-sidebar" id="music-sidebar" aria-hidden="true" aria-label="Music player">
  <div class="music-sidebar-inner">

    <!-- Album art (generated SVG, swaps per track) -->
    <div class="music-art" id="music-art"></div>

    <!-- Track info -->
    <div class="music-info">
      <div class="music-title" id="music-title">Nocturne I</div>
      <div class="music-artist" id="music-artist">Ambient Collection</div>
    </div>

    <!-- Progress -->
    <div class="music-progress-wrap">
      <input type="range" class="music-progress" id="music-progress" min="0" max="180" value="0" aria-label="Track progress"/>
      <div class="music-time">
        <span id="music-elapsed">0:00</span>
        <span id="music-duration">3:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="music-controls">
      <div class="music-btn" id="music-prev" tabindex="0" role="button" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/>
        </svg>
      </div>
      <div class="music-btn play" id="music-play" tabindex="0" role="button" aria-label="Play or pause">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
      </div>
      <div class="music-btn" id="music-next" tabindex="0" role="button" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/>
        </svg>
      </div>
    </div>

    <!-- Volume -->
    <div class="music-volume-wrap">
      <div class="music-volume-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
      </div>
      <input type="range" class="music-volume" id="music-volume" min="0" max="100" value="60" aria-label="Volume"/>
    </div>

    <!-- Playlist -->
    <div class="music-playlist-label">Playlist</div>
    <div class="music-playlist" id="music-playlist"></div>

  </div>
</aside>

<script>
'use strict';

/* ------ Detect touch device ------ */
const isTouch = window.matchMedia('(hover: none)').matches;

/* ------ Nav height parsed once ------ */
const NAV_HEIGHT = parseInt(
  getComputedStyle(document.documentElement).getPropertyValue('--nav-height')
);

/* ------ Shared activate helper (click + Enter/Space keydown) ------ */
function onActivate(el, fn) {
  el.addEventListener('click', fn);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(e); }
  });
}

/* ============================================================
   SETUP: Inject nav links
============================================================ */
const NAV_ITEMS = ['Home', 'About', 'Portfolio', 'Pricing', 'Contact'];

const navLinksEl = document.getElementById('nav-links');
const navPillEl  = document.getElementById('nav-pill');

NAV_ITEMS.forEach((label) => {
  const link = document.createElement('div');
  link.className = 'nav-link';
  link.setAttribute('data-label', label);
  link.setAttribute('role', 'button');
  link.setAttribute('tabindex', '0');
  link.setAttribute('aria-label', label);
  label.split('').forEach((char) => {
    const span = document.createElement('span');
    span.className = 'char';
    span.textContent = char;
    link.appendChild(span);
  });
  navLinksEl.appendChild(link);
});

const navInner       = document.getElementById('nav-inner');
const navBorder      = document.getElementById('nav-border');
const brandEl        = document.getElementById('brand');
const brandMark      = document.getElementById('brand-mark');
const navLinks       = Array.from(navLinksEl.querySelectorAll('.nav-link'));
const searchBtn      = document.getElementById('search-btn');
const searchExpanded = document.getElementById('search-expanded');
const searchInput    = document.getElementById('search-input');
const searchClose    = document.getElementById('search-close');
const trailCanvas    = document.getElementById('trail-canvas');
const navEl          = document.getElementById('main-nav');

/* ============================================================
   EASING UTILITIES
============================================================ */
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function easeOutExpo(t) {
  return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

/* ============================================================
   CACHED RECTS — invalidated on resize
============================================================ */
let linkRectsCache = null;
let linksContainerRect = null;

function invalidateRects() {
  linkRectsCache = null;
  linksContainerRect = null;
}

function getLinkRects() {
  if (!linkRectsCache) {
    linksContainerRect = navLinksEl.getBoundingClientRect();
    linkRectsCache = navLinks.map(l => l.getBoundingClientRect());
  }
  return { rects: linkRectsCache, container: linksContainerRect };
}

/* ============================================================
   PILL STATE
============================================================ */
const pill = {
  x: 0, w: 0, alpha: 0,
  tx: 0, tw: 0, talpha: 0,
  xSpeed: 0.12, wSpeed: 0.09, aSpeed: 0.10,
  // Last written values — skip write if unchanged
  _lx: null, _lw: null, _la: null,
};

function pillMoveTo(linkEl) {
  if (!linkEl) { pill.talpha = 0; return; }
  // Read live rects at event time for accuracy
  const linksRect = navLinksEl.getBoundingClientRect();
  const linkRect  = linkEl.getBoundingClientRect();
  pill.tx     = linkRect.left - linksRect.left;
  pill.tw     = linkRect.width;
  pill.talpha = 1;
  // Invalidate cache since we just got fresh data
  invalidateRects();
}

function pillHide() {
  pill.talpha = 0;
}

/* ============================================================
   MAGNETIC STATE
============================================================ */
const magnetic = {
  links: navLinks.map(link => ({ el: link, ox: 0, oy: 0, tx: 0, ty: 0 })),
  mouseX: 0,
  mouseY: 0,
};

/* ============================================================
   STAR STATE
============================================================ */
const star = {
  angle: 0,
  velCurrent: 0.5,
  velTarget: 0.5,
  scaleCurrent: 1.0,
  scaleTarget: 1.0,
  opacityCurrent: 0.7,
  opacityTarget: 0.7,
  glowCurrent: 0,
  glowTarget: 0,
  isHovered: false,
  isBursting: false,
  burstStart: null,
  burstDuration: 500,
  IDLE_VEL:  360 / 12 / 60,
  HOVER_VEL: 360 / 1.5 / 60,
  BURST_VEL: 360 / 0.5 / 60,
  // Last written values (opacity + glow only — transform changes every frame)
  _lOpacity: null,
  _lGlow: null,
};

/* ============================================================
   TRAIL STATE
============================================================ */
const trail = {
  dots: [],
  ctx:  null,
};

function initTrail() {
  trail.ctx = trailCanvas.getContext('2d');
  resizeTrailCanvas();
}

function resizeTrailCanvas() {
  const dpr = window.devicePixelRatio || 1;
  trailCanvas.width  = window.innerWidth * dpr;
  trailCanvas.height = NAV_HEIGHT * dpr;
  trailCanvas.style.width  = window.innerWidth + 'px';
  trailCanvas.style.height = NAV_HEIGHT + 'px';
  // Reset transform before scaling — prevents accumulation on repeated resizes
  if (trail.ctx) trail.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function addTrailDot(x, y) {
  if (isTouch) return;
  trail.dots.push({
    x, y,
    created: performance.now(),
    ttl:    420,
    radius: 1.8 + Math.random() * 0.7,
  });
}

/* ============================================================
   AMBIENT STATE
============================================================ */
const ambient = {
  active:    false,
  idleTimer: null,
  t:         0,
  phases: NAV_ITEMS.map((_, i) => i * Math.PI * 0.65),
};

function startAmbient() {
  ambient.active = true;
}

function stopAmbient() {
  if (!ambient.active) return;
  ambient.active = false;
  navLinks.forEach((link, i) => {
    const m = magnetic.links[i];
    link.style.transition = 'transform 0.6s ease';
    link.style.transform  = `translate(${m.ox.toFixed(2)}px, ${m.oy.toFixed(2)}px)`;
  });
}

function resetIdleTimer() {
  if (ambient.idleTimer) clearTimeout(ambient.idleTimer);
  stopAmbient();
  ambient.idleTimer = setTimeout(startAmbient, 3000);
}

/* ============================================================
   MASTER rAF LOOP — single loop drives everything
============================================================ */
let masterRaf = null;

function masterTick(ts) {
  // --- PILL ---
  updatePill();

  // --- MAGNETIC (non-touch only) ---
  if (!isTouch) {
    updateMagnetic();
  }

  // --- STAR ---
  updateStar(ts);

  // --- TRAIL (non-touch only) ---
  if (!isTouch) {
    drawTrail(ts);
  }

  // --- AMBIENT ---
  if (ambient.active) {
    updateAmbient();
  }

  masterRaf = requestAnimationFrame(masterTick);
}

/* ============================================================
   PILL UPDATE
============================================================ */
function updatePill() {
  pill.x     = lerp(pill.x,     pill.tx,     pill.xSpeed);
  pill.w     = lerp(pill.w,     pill.tw,     pill.wSpeed);
  pill.alpha = lerp(pill.alpha, pill.talpha, pill.aSpeed);

  // Only write if values meaningfully changed
  const newX = pill.x;
  const newW = pill.w;
  const newA = pill.alpha;

  if (pill._lx !== newX || pill._lw !== newW) {
    navPillEl.style.transform = `translateY(-50%) translateX(${newX}px)`;
    navPillEl.style.width     = newW + 'px';
    pill._lx = newX;
    pill._lw = newW;
  }
  if (pill._la !== newA) {
    navPillEl.style.opacity = newA.toString();
    pill._la = newA;
  }
}

/* ============================================================
   MAGNETIC UPDATE
============================================================ */
function updateMagnetic() {
  const mx = magnetic.mouseX;
  const my = magnetic.mouseY;
  const { rects } = getLinkRects();
  const RADIUS   = 70;
  const STRENGTH = 0.3;
  const LERP_T   = 0.14;

  magnetic.links.forEach((m, i) => {
    const rect = rects[i];
    const cx = rect.left + rect.width  * 0.5;
    const cy = rect.top  + rect.height * 0.5;
    const dx = mx - cx;
    const dy = my - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < RADIUS) {
      const pull = (1 - dist / RADIUS);
      m.tx = dx * pull * STRENGTH;
      m.ty = dy * pull * STRENGTH;
    } else {
      m.tx = 0;
      m.ty = 0;
    }

    m.ox = lerp(m.ox, m.tx, LERP_T);
    m.oy = lerp(m.oy, m.ty, LERP_T);

    // When ambient is active, updateAmbient writes the combined transform
    if (!ambient.active) {
      m.el.style.transform = `translate(${m.ox.toFixed(2)}px, ${m.oy.toFixed(2)}px)`;
    }
  });
}

/* ============================================================
   AMBIENT UPDATE
============================================================ */
function updateAmbient() {
  ambient.t += 0.008;
  navLinks.forEach((link, i) => {
    const wave  = Math.sin(ambient.t + ambient.phases[i]);
    const scale = 1 + wave * 0.0018;
    const m = magnetic.links[i];
    link.style.transform =
      `translate(${m.ox.toFixed(2)}px, ${m.oy.toFixed(2)}px) scale(${scale})`;
  });
}

/* ============================================================
   STAR UPDATE
============================================================ */
function updateStar(ts) {
  // Burst mode
  if (star.isBursting) {
    if (!star.burstStart) star.burstStart = ts;
    const elapsed  = ts - star.burstStart;
    const progress = Math.min(elapsed / star.burstDuration, 1);
    star.velTarget = lerp(star.BURST_VEL, star.IDLE_VEL, easeOutExpo(progress));
    if (progress >= 1) {
      star.isBursting = false;
      star.burstStart = null;
      star.velTarget  = star.isHovered ? star.HOVER_VEL : star.IDLE_VEL;
    }
  }

  star.velCurrent     = lerp(star.velCurrent,     star.velTarget,     0.04);
  star.angle         += star.velCurrent;
  star.scaleCurrent   = lerp(star.scaleCurrent,   star.scaleTarget,   0.08);
  star.opacityCurrent = lerp(star.opacityCurrent, star.opacityTarget, 0.1);
  star.glowCurrent    = lerp(star.glowCurrent,    star.glowTarget,    0.08);

  const scale   = star.scaleCurrent;
  const opacity = star.opacityCurrent;
  const glow    = star.glowCurrent;

  // Transform always changes (angle increments every frame)
  brandMark.style.transform = `rotate(${star.angle}deg) scale(${scale.toFixed(4)})`;

  // Opacity only changes during hover transitions — skip write when stable
  const newOpacity = opacity.toFixed(4);
  if (star._lOpacity !== newOpacity) {
    brandMark.style.opacity = newOpacity;
    star._lOpacity = newOpacity;
  }

  if (glow > 0.002) {
    const newGlow =
      `0 0 ${(glow * 12).toFixed(1)}px rgba(181, 134, 90, ${(glow * 0.5).toFixed(3)}),` +
      `0 0 ${(glow * 24).toFixed(1)}px rgba(181, 134, 90, ${(glow * 0.25).toFixed(3)})`;
    if (star._lGlow !== newGlow) {
      brandMark.style.textShadow = newGlow;
      star._lGlow = newGlow;
    }
  } else if (star._lGlow !== '') {
    brandMark.style.textShadow = '';
    star._lGlow = '';
  }
}

/* ============================================================
   TRAIL DRAW
============================================================ */
function drawTrail(ts) {
  const ctx = trail.ctx;
  if (!ctx) return;

  // Skip draw when no dots
  if (trail.dots.length === 0) return;

  const dpr = window.devicePixelRatio || 1;
  const w   = trailCanvas.width  / dpr;
  const h   = trailCanvas.height / dpr;
  ctx.clearRect(0, 0, w, h);

  const now = performance.now();
  trail.dots = trail.dots.filter(d => {
    const age = now - d.created;
    if (age >= d.ttl) return false;
    const t     = age / d.ttl;
    const alpha = 0.09 * (1 - t * t);
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.fillStyle = isDark
      ? `rgba(237, 233, 227, ${alpha})`
      : `rgba(26, 25, 23, ${alpha})`;
    ctx.fill();
    return true;
  });

  // If we just cleared all dots, clear the canvas too
  if (trail.dots.length === 0) {
    ctx.clearRect(0, 0, w, h);
  }
}

/* ============================================================
   1. PAGE LOAD ENTRANCE ANIMATION
============================================================ */
(function doEntrance() {
  let startTime = null;
  const TOTAL = 1200;

  function tick(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;
    const t = Math.min(elapsed / TOTAL, 1);

    if (t < 0.35) {
      const ease = easeInOutCubic(t / 0.35);
      navBorder.style.width = (ease * 100) + '%';
    } else if (t < 0.50) {
      navBorder.style.width   = '100%';
      navBorder.style.opacity = (1 - ((t - 0.35) / 0.15) * 0.6).toString();
    } else {
      navBorder.style.width   = '100%';
      navBorder.style.opacity = '0.4';

      const contentT  = (t - 0.50) / 0.50;
      const brandEase = easeOutExpo(Math.max(0, Math.min(contentT / 0.5, 1)));
      navInner.style.opacity   = brandEase.toString();
      navInner.style.transform = `translateX(${(1 - brandEase) * -12}px)`;

      navLinks.forEach((link, i) => {
        const linkDelay = 0.1 + i * 0.06;
        const linkT     = Math.max(0, Math.min((contentT - linkDelay) / 0.45, 1));
        const linkEase  = easeOutExpo(linkT);
        link.style.opacity   = linkEase.toString();
        link.style.transform = `translateY(${(1 - linkEase) * 6}px)`;
      });
    }

    if (t < 1) {
      requestAnimationFrame(tick);
    } else {
      navInner.style.transform = '';
      navInner.style.opacity   = '1';
      navLinks.forEach(link => {
        link.style.transform = '';
        link.style.opacity   = '1';
      });
    }
  }

  navLinks.forEach(link => { link.style.opacity = '0'; });
  setTimeout(() => requestAnimationFrame(tick), 100);
})();

/* ============================================================
   CHARACTER STAGGER ANIMATION
============================================================ */
function animateCharsIn(linkEl, delay) {
  const chars = linkEl.querySelectorAll('.char');
  chars.forEach((c, i) => {
    clearTimeout(c._tout);
    c._tout = setTimeout(() => {
      c.style.transition = `transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) ${i * delay}ms,opacity 0.25s ease ${i * delay}ms`;
      c.style.transform  = 'translateY(-3px)';
      c.style.opacity    = '1';
    }, i * delay);
  });
}

function animateCharsOut(linkEl, delay) {
  const chars = linkEl.querySelectorAll('.char');
  chars.forEach((c, i) => {
    clearTimeout(c._tout);
    c._tout = setTimeout(() => {
      c.style.transition = `transform 0.35s cubic-bezier(0.25, 1, 0.5, 1) ${i * delay}ms,opacity 0.25s ease ${i * delay}ms`;
      c.style.transform  = 'translateY(0px)';
      c.style.opacity    = '';
    }, i * delay);
  });
}

/* ============================================================
   STAR EVENT HANDLERS
============================================================ */
brandEl.addEventListener('mouseenter', () => {
  if (isTouch) return;
  star.isHovered      = true;
  star.velTarget      = star.HOVER_VEL;
  star.scaleTarget    = 1.3;
  star.opacityTarget  = 1.0;
  star.glowTarget     = 1.0;
  resetIdleTimer();
});

brandEl.addEventListener('mouseleave', () => {
  if (isTouch) return;
  star.isHovered = false;
  if (!star.isBursting) star.velTarget = star.IDLE_VEL;
  star.scaleTarget   = 1.0;
  star.opacityTarget = 0.7;
  star.glowTarget    = 0.0;
});

onActivate(brandEl, () => {
  star.isBursting = true;
  star.burstStart = null;
  star.velTarget  = star.BURST_VEL;
});

/* ============================================================
   SEARCH EXPAND / COLLAPSE
============================================================ */
let searchOpen = false;

function openSearch() {
  if (searchOpen) return;
  searchOpen = true;
  navLinksEl.classList.add('hidden');
  searchBtn.classList.add('search-btn--hidden');
  searchExpanded.setAttribute('aria-hidden', 'false');
  searchExpanded.classList.add('active');
  searchBtn.setAttribute('aria-expanded', 'true');
  setTimeout(() => searchInput.focus(), 200);
  resetIdleTimer();
}

function closeSearch() {
  if (!searchOpen) return;
  searchOpen = false;
  searchExpanded.classList.remove('active');
  searchExpanded.setAttribute('aria-hidden', 'true');
  searchBtn.setAttribute('aria-expanded', 'false');
  searchInput.value = '';
  searchBtn.classList.remove('search-btn--hidden');
  navLinksEl.classList.remove('hidden');
  resetIdleTimer();
}

onActivate(searchBtn, () => { if (searchOpen) closeSearch(); else openSearch(); });
onActivate(searchClose, closeSearch);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && searchOpen) closeSearch(); });

/* ============================================================
   NAV LINK EVENTS — delegated on container
============================================================ */
let currentHoveredLink = null;
let lastTrailX = 0, lastTrailY = 0, trailThrottle = 0;

navLinksEl.addEventListener('mouseover', (e) => {
  const link = e.target.closest('.nav-link');
  if (!link || link === currentHoveredLink) return;
  if (currentHoveredLink) animateCharsOut(currentHoveredLink, 18);
  currentHoveredLink = link;
  pillMoveTo(link);
  animateCharsIn(link, 28);
  resetIdleTimer();
});

navLinksEl.addEventListener('mouseleave', () => {
  if (currentHoveredLink) {
    animateCharsOut(currentHoveredLink, 18);
    currentHoveredLink = null;
  }
  pillHide();
});

navLinksEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') e.preventDefault();
});

/* ============================================================
   GLOBAL MOUSE MOVE — drive magnetic + trail
============================================================ */
let navRect = navEl.getBoundingClientRect();

window.addEventListener('resize', () => {
  navRect = navEl.getBoundingClientRect();
  resizeTrailCanvas();
  invalidateRects();
});

document.addEventListener('mousemove', (e) => {
  if (isTouch) return;
  magnetic.mouseX = e.clientX;
  magnetic.mouseY = e.clientY;

  // Trail — only inside nav bar
  if (e.clientY <= navRect.height) {
    const now = performance.now();
    if (now - trailThrottle > 28) {
      trailThrottle = now;
      const dx   = e.clientX - lastTrailX;
      const dy   = e.clientY - lastTrailY;
      if (Math.sqrt(dx * dx + dy * dy) > 5) {
        addTrailDot(e.clientX, e.clientY);
        lastTrailX = e.clientX;
        lastTrailY = e.clientY;
      }
    }
  }

  resetIdleTimer();
}, { passive: true });

/* ============================================================
   NAV ENTER / LEAVE
============================================================ */
navEl.addEventListener('mouseenter', () => {
  stopAmbient();
  if (ambient.idleTimer) clearTimeout(ambient.idleTimer);
});

navEl.addEventListener('mouseleave', () => {
  magnetic.links.forEach(m => { m.tx = 0; m.ty = 0; });
  resetIdleTimer();
});

/* ============================================================
   INIT
============================================================ */
if (!isTouch) initTrail();
resetIdleTimer();

// Pre-position pill at middle link so it doesn't fly from 0,0
requestAnimationFrame(() => {
  if (navLinks.length > 0) {
    const { rects, container } = getLinkRects();
    const mid = navLinks[Math.floor(navLinks.length / 2)];
    const idx = navLinks.indexOf(mid);
    pill.x     = rects[idx].left - container.left;
    pill.w     = rects[idx].width;
    pill.alpha = 0;
  }
  // Start master loop after one frame so DOM is settled
  masterRaf = requestAnimationFrame(masterTick);
});
/* ============================================================
   DARK MODE
============================================================ */
const htmlEl      = document.documentElement;
const themeToggle = document.getElementById('theme-toggle');
const iconSun     = document.getElementById('icon-sun');
const iconMoon    = document.getElementById('icon-moon');

function applyTheme(theme) {
  htmlEl.setAttribute('data-theme', theme);
  iconSun.style.display  = theme === 'dark' ? '' : 'none';
  iconMoon.style.display = theme === 'dark' ? 'none' : '';
  try { localStorage.setItem('maison-theme', theme); } catch(e) {}
}

(function initTheme() {
  let saved = 'light';
  try { saved = localStorage.getItem('maison-theme') || 'light'; } catch(e) {}
  applyTheme(saved);
})();

onActivate(themeToggle, () => {
  applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* ============================================================
   MUSIC PLAYER
============================================================ */
const TRACKS = [
  {
    title:  'Nocturne I',
    artist: 'Ambient Collection',
    dur:    180,
    freqs:  [110, 130.8, 164.8, 220],       // Am
    art:    ['#1a1917', '#2d2b28', '#3d3a35'],
  },
  {
    title:  'Soleil II',
    artist: 'Ambient Collection',
    dur:    180,
    freqs:  [146.8, 185, 220, 293.7],        // Dm
    art:    ['#1d2028', '#252a38', '#2e3548'],
  },
  {
    title:  'Brume III',
    artist: 'Ambient Collection',
    dur:    180,
    freqs:  [130.8, 164.8, 196, 261.6],      // Cm
    art:    ['#1a1d1a', '#222722', '#2a3029'],
  },
  {
    title:  'Aube IV',
    artist: 'Ambient Collection',
    dur:    180,
    freqs:  [164.8, 196, 246.9, 329.6],      // Em
    art:    ['#201d18', '#2c2820', '#3a342a'],
  },
];

const TRACK_DURATION = 180; // seconds

const musicState = {
  currentTrack: 0,
  isPlaying:    false,
  elapsed:      0,
  volume:       0.6,
  progressTimer: null,
  audioCtx:     null,
  masterGain:   null,
  nodes:        [],
};

/* DOM refs */
const musicSidebar  = document.getElementById('music-sidebar');
const musicTab      = document.getElementById('music-tab');
const musicArt      = document.getElementById('music-art');
const musicTitle    = document.getElementById('music-title');
const musicArtist   = document.getElementById('music-artist');
const musicProgress = document.getElementById('music-progress');
const musicElapsed  = document.getElementById('music-elapsed');
const musicDuration = document.getElementById('music-duration');
const musicPlayBtn  = document.getElementById('music-play');
const musicPrevBtn  = document.getElementById('music-prev');
const musicNextBtn  = document.getElementById('music-next');
const musicVolume   = document.getElementById('music-volume');
const musicPlaylist = document.getElementById('music-playlist');
const iconPlayEl    = document.getElementById('icon-play');
const iconPauseEl   = document.getElementById('icon-pause');

/* Build album art SVG per track */
function buildArt(track) {
  const [c1, c2, c3] = track.art;
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="${c1}"/>
    <circle cx="100" cy="100" r="80" fill="${c2}" opacity="0.6"/>
    <circle cx="100" cy="100" r="45" fill="${c3}" opacity="0.7"/>
    <circle cx="100" cy="100" r="15" fill="${c1}" opacity="0.9"/>
    <circle cx="100" cy="100" r="4" fill="${c2}"/>
    <line x1="60" y1="30" x2="100" y2="100" stroke="${c3}" stroke-width="0.5" opacity="0.4"/>
    <line x1="140" y1="30" x2="100" y2="100" stroke="${c3}" stroke-width="0.5" opacity="0.4"/>
    <line x1="170" y1="100" x2="100" y2="100" stroke="${c3}" stroke-width="0.5" opacity="0.4"/>
    <line x1="30" y1="100" x2="100" y2="100" stroke="${c3}" stroke-width="0.5" opacity="0.4"/>
  </svg>`;
}

/* Build playlist items */
function buildPlaylist() {
  musicPlaylist.innerHTML = '';
  TRACKS.forEach((t, i) => {
    const item = document.createElement('div');
    item.className = 'music-track-item' + (i === musicState.currentTrack ? ' active' : '');
    item.setAttribute('role', 'button');
    item.setAttribute('tabindex', '0');
    item.setAttribute('aria-label', `Play ${t.title}`);
    item.innerHTML = `
      <span class="music-track-num">${i + 1}</span>
      <div class="music-track-info">
        <div class="music-track-name">${t.title}</div>
      </div>
      <span class="music-track-dur">${formatTime(t.dur)}</span>`;
    onActivate(item, () => selectTrack(i));
    musicPlaylist.appendChild(item);
  });
}

function formatTime(s) {
  return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
}

function updatePlayerUI() {
  const t = TRACKS[musicState.currentTrack];
  musicTitle.textContent  = t.title;
  musicArtist.textContent = t.artist;
  musicArt.innerHTML      = buildArt(t);
  musicDuration.textContent = formatTime(t.dur);
  musicProgress.max = t.dur;
  musicProgress.value = musicState.elapsed;
  musicElapsed.textContent = formatTime(musicState.elapsed);
  iconPlayEl.style.display   = musicState.isPlaying ? 'none' : '';
  iconPauseEl.style.display  = musicState.isPlaying ? '' : 'none';
  // Playlist active state
  musicPlaylist.querySelectorAll('.music-track-item').forEach((el, i) => {
    el.classList.toggle('active', i === musicState.currentTrack);
  });
}

/* ---- Web Audio ---- */
function ensureAudioCtx() {
  if (!musicState.audioCtx) {
    musicState.audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
    musicState.masterGain = musicState.audioCtx.createGain();
    musicState.masterGain.gain.value = 0;
    musicState.masterGain.connect(musicState.audioCtx.destination);
  }
  if (musicState.audioCtx.state === 'suspended') musicState.audioCtx.resume();
}

function stopAudio() {
  const nodes = musicState.nodes;
  if (nodes.length === 0) return;
  const ctx = musicState.audioCtx;
  if (!ctx) return;
  const now = ctx.currentTime;
  musicState.masterGain.gain.cancelScheduledValues(now);
  musicState.masterGain.gain.setValueAtTime(musicState.masterGain.gain.value, now);
  musicState.masterGain.gain.linearRampToValueAtTime(0, now + 0.6);
  setTimeout(() => {
    nodes.forEach(n => { try { if (n.stop) n.stop(); n.disconnect(); } catch(_){} });
    musicState.nodes = [];
  }, 700);
}

function startAudio(track) {
  ensureAudioCtx();
  stopAudio();
  const ctx  = musicState.audioCtx;
  const now  = ctx.currentTime;
  const gain = musicState.masterGain;

  track.freqs.forEach((freq, i) => {
    const osc  = ctx.createOscillator();
    const gn   = ctx.createGain();
    const lfo  = ctx.createOscillator();
    const lfoG = ctx.createGain();
    const dly  = ctx.createDelay(2.0);
    const dlyG = ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.detune.value = (i % 2 === 0 ? 1 : -1) * (3 + i * 1.5);

    gn.gain.value = 0.22 / track.freqs.length;

    lfo.type = 'sine';
    lfo.frequency.value = 0.07 + i * 0.04;
    lfoG.gain.value = 0.08;

    dly.delayTime.value = 0.25 + i * 0.18;
    dlyG.gain.value = 0.28;

    lfo.connect(lfoG);
    lfoG.connect(gn.gain);
    osc.connect(gn);
    gn.connect(gain);
    gn.connect(dly);
    dly.connect(dlyG);
    dlyG.connect(gain);

    osc.start(now);
    lfo.start(now);

    musicState.nodes.push(osc, lfo, gn, lfoG, dly, dlyG);
  });

  gain.gain.cancelScheduledValues(now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(musicState.volume * 0.28, now + 2.5);
}

/* ---- Progress timer ---- */
function startProgressTimer() {
  stopProgressTimer();
  musicState.progressTimer = setInterval(() => {
    musicState.elapsed++;
    if (musicState.elapsed >= TRACKS[musicState.currentTrack].dur) {
      musicState.elapsed = 0;
      selectTrack((musicState.currentTrack + 1) % TRACKS.length, true);
      return;
    }
    musicProgress.value = musicState.elapsed;
    musicElapsed.textContent = formatTime(musicState.elapsed);
  }, 1000);
}

function stopProgressTimer() {
  if (musicState.progressTimer) {
    clearInterval(musicState.progressTimer);
    musicState.progressTimer = null;
  }
}

/* ---- Track selection ---- */
function selectTrack(index, autoplay) {
  musicState.currentTrack = index;
  musicState.elapsed = 0;
  if (musicState.isPlaying || autoplay) {
    musicState.isPlaying = true;
    startAudio(TRACKS[index]);
    startProgressTimer();
  }
  updatePlayerUI();
}

function togglePlay() {
  musicState.isPlaying = !musicState.isPlaying;
  if (musicState.isPlaying) {
    startAudio(TRACKS[musicState.currentTrack]);
    startProgressTimer();
  } else {
    stopAudio();
    stopProgressTimer();
  }
  updatePlayerUI();
}

/* ---- Sidebar toggle ---- */
let sidebarOpen = false;

function openSidebar() {
  sidebarOpen = true;
  musicSidebar.classList.add('open');
  musicTab.classList.add('sidebar-open');
  musicSidebar.setAttribute('aria-hidden', 'false');
  musicTab.setAttribute('aria-expanded', 'true');
}

function closeSidebar() {
  sidebarOpen = false;
  musicSidebar.classList.remove('open');
  musicTab.classList.remove('sidebar-open');
  musicSidebar.setAttribute('aria-hidden', 'true');
  musicTab.setAttribute('aria-expanded', 'false');
}

/* ---- Event wiring ---- */
onActivate(musicTab,     () => { if (sidebarOpen) closeSidebar(); else openSidebar(); });
onActivate(musicPlayBtn, togglePlay);
onActivate(musicPrevBtn, () => selectTrack((musicState.currentTrack - 1 + TRACKS.length) % TRACKS.length));
onActivate(musicNextBtn, () => selectTrack((musicState.currentTrack + 1) % TRACKS.length));

musicProgress.addEventListener('input', () => {
  musicState.elapsed = parseInt(musicProgress.value, 10);
  musicElapsed.textContent = formatTime(musicState.elapsed);
});

musicVolume.addEventListener('input', () => {
  musicState.volume = parseInt(musicVolume.value, 10) / 100;
  if (musicState.audioCtx && musicState.isPlaying) {
    musicState.masterGain.gain.value = musicState.volume * 0.28;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sidebarOpen) closeSidebar();
});

/* ---- Init player UI ---- */
buildPlaylist();
updatePlayerUI();
</script>
</body>
</html>
